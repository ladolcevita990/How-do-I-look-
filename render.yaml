# Render Blueprint — one-click deploy for the How Do I Look? backend.
#
# After signing in to Render (https://render.com) with GitHub, click
# "New +" → "Blueprint" and point it at this repository. Render reads
# this file and provisions the service below. You will still need to
# set three env vars manually in the dashboard after the first build:
#
#   SESSION_COOKIE_SECRET  — a random 32+ character string
#   FRONTEND_URL           — your Vercel URL, e.g. https://how-do-i-look.vercel.app
#   CORS_EXTRA_ORIGINS     — same as FRONTEND_URL if you want preview deploys too
#
# ── Plan ────────────────────────────────────────────────────────────────────
# This blueprint uses the *Starter* plan (~$7/month) because it is the only
# Render web-service plan that supports a persistent disk. Without a disk,
# uploaded photos, the SQLite database, and saved outfits would be wiped
# every time the service restarts or sleeps — which would kill the whole
# "your stuff persists when you come back" promise.
#
# If you want truly $0/month, switch ``plan: starter`` to ``plan: free``,
# delete the ``disk:`` block, and add Cloudflare R2 + Supabase Postgres env
# vars instead. See README → "Free-forever variant" for details.
#
# The frontend is deployed separately on Vercel. See the README for the
# step-by-step walkthrough.

services:
  - type: web
    name: how-do-i-look-api
    runtime: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: hdil-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: TRYON_BACKEND
        value: stub
      - key: STORAGE_BACKEND
        value: local
      - key: LOCAL_STORAGE_DIR
        value: /app/data/files
      - key: DATABASE_URL
        value: sqlite:////app/data/howdoilook.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: none
      # Set these manually in the Render dashboard after first deploy:
      - key: SESSION_COOKIE_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_EXTRA_ORIGINS
        sync: false
