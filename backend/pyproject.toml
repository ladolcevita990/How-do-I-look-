[project]
name = "howdoilook-backend"
version = "0.1.0"
description = "Virtual try-on application backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "boto3>=1.35.0",
    "replicate>=0.34.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "rembg>=2.0.0",
    "Pillow>=10.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic-settings>=2.0.0",
    "mediapipe>=0.10.0",
    "numpy>=1.26.0",
    "aiofiles>=24.0.0",
    "itsdangerous>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
